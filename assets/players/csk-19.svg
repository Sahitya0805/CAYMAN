<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="100%" height="100%">
  <defs>
    <linearGradient id="jerseyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAB81E"/>
      <stop offset="50%" stop-color="#F59E1B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112347"/>
      <stop offset="100%" stop-color="#080E18"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#080E18" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Neck & Shoulders -->
    <path d="M178 185 L178 230 Q200 245 222 230 L222 185 Z" fill="#6B4023"/>
    
    <!-- Head / Face -->
    <ellipse cx="200" cy="155" rx="36" ry="46" fill="#6B4023"/>
    <ellipse cx="162" cy="155" rx="5" ry="10" fill="#6B4023"/>
    <ellipse cx="238" cy="155" rx="5" ry="10" fill="#6B4023"/>

    <!-- Hair -->
    
        <path d="M165 140 Q200 95 235 140 Q238 120 220 105 Q200 95 180 105 Q162 120 165 140 Z" fill="#0A0A0A"/>
    

    <!-- Facial Features -->
    <ellipse cx="188" cy="150" rx="3" ry="2" fill="#1E1E1E"/>
    <ellipse cx="212" cy="150" rx="3" ry="2" fill="#1E1E1E"/>
    <path d="M197 155 L199 168 L203 168" stroke="#1E1E1E" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M192 178 Q200 184 208 178" stroke="#1E1E1E" stroke-width="2" fill="none" opacity="0.7"/>
    

    <!-- Athletic Torso & Jersey -->
    <!-- Left Arm -->
    <path d="M125 240 L80 340 Q75 355 90 360 L130 330 L150 250 Z" fill="url(#jerseyGrad)"/>
    <!-- Right Arm -->
    <path d="M275 240 L320 340 Q325 355 310 360 L270 330 L250 250 Z" fill="url(#jerseyGrad)"/>
    <!-- Sleeve Accents -->
    <path d="M78 335 L125 320 L128 332 L83 348 Z" fill="url(#navyGrad)"/>
    <path d="M322 335 L275 320 L272 332 L317 348 Z" fill="url(#navyGrad)"/>

    

    <!-- Main Torso -->
    <path d="M125 240 Q200 220 275 240 L290 490 Q200 520 110 490 Z" fill="url(#jerseyGrad)"/>

    <!-- Jersey Collar (Navy Deep V-Collar) -->
    <path d="M165 228 L200 280 L235 228 L220 226 L200 258 L180 226 Z" fill="url(#navyGrad)"/>
    <path d="M155 226 L175 226 L200 265 L225 226 L245 226 Q200 242 155 226 Z" fill="#F2600C" opacity="0.9"/>

    <!-- Dynamic Flame Stripes on Side Flanks -->
    <path d="M112 430 L132 380 L120 370 L145 320 L130 310 L150 260 L135 255 L118 360 Z" fill="#09152B" opacity="0.85"/>
    <path d="M288 430 L268 380 L280 370 L255 320 L270 310 L250 260 L265 255 L282 360 Z" fill="#09152B" opacity="0.85"/>
    <path d="M118 450 L142 395 L132 390 L152 345 L138 340 L122 460 Z" fill="#F2600C" opacity="0.95"/>
    <path d="M282 450 L258 395 L268 390 L248 345 L262 340 L278 460 Z" fill="#F2600C" opacity="0.95"/>

    <!-- Chest Sponsor / CSK Lion Emblem -->
    <!-- Left Chest CSK Lion Shield -->
    <circle cx="165" cy="285" r="16" fill="#09152B" stroke="#FAB81E" stroke-width="1.5"/>
    <path d="M160 280 Q165 272 170 280 Q167 288 160 280 Z" fill="#FAB81E"/>
    <circle cx="165" cy="282" r="4" fill="#F2600C"/>

    <!-- Right Chest Principal Sponsor (KÜHL) -->
    <rect x="225" y="276" width="32" height="15" rx="2" fill="#09152B" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
    <text x="241" y="287" font-family="'Montserrat', sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">KÜHL</text>

    <!-- Center Chest Title Sponsor (SHREE CEMENT) -->
    <rect x="148" y="320" width="104" height="34" rx="4" fill="#FFFFFF" stroke="#09152B" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))"/>
    <text x="200" y="335" font-family="'Montserrat', sans-serif" font-size="11" font-weight="900" fill="#D9222A" text-anchor="middle" letter-spacing="0.8">Shree</text>
    <text x="200" y="347" font-family="'Montserrat', sans-serif" font-size="9" font-weight="900" fill="#080E18" text-anchor="middle" letter-spacing="0.5">CEMENT</text>

    <!-- Lower Chest Jersey Number Watermark -->
    <text x="200" y="435" font-family="'Bebas Neue', 'Montserrat', Impact, sans-serif" font-size="52" font-weight="900" fill="rgba(9, 21, 43, 0.22)" text-anchor="middle">95</text>
  </g>
</svg>