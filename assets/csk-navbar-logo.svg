<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="240" height="220">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="50%" stop-color="#FAB81E"/>
      <stop offset="100%" stop-color="#E58D05"/>
    </linearGradient>
    <linearGradient id="navyShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12254C"/>
      <stop offset="100%" stop-color="#071124"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#goldGlow)">
    <!-- Wings / Outer Radiance -->
    <path d="M 120 40 C 90 10 35 15 15 50 C 5 68 8 92 18 115 C 32 145 65 170 120 195 C 175 170 208 145 222 115 C 232 92 235 68 225 50 C 205 15 150 10 120 40 Z" fill="url(#navyShield)" stroke="url(#goldGrad)" stroke-width="3.5"/>

    <!-- Wing details Left -->
    <path d="M 22 55 Q 60 70 85 95" stroke="#FAB81E" stroke-width="2.5" fill="none" opacity="0.8"/>
    <path d="M 28 80 Q 65 95 88 118" stroke="#FAB81E" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 38 105 Q 75 118 92 138" stroke="#FAB81E" stroke-width="2" fill="none" opacity="0.8"/>

    <!-- Wing details Right -->
    <path d="M 218 55 Q 180 70 155 95" stroke="#FAB81E" stroke-width="2.5" fill="none" opacity="0.8"/>
    <path d="M 212 80 Q 175 95 152 118" stroke="#FAB81E" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 202 105 Q 165 118 148 138" stroke="#FAB81E" stroke-width="2" fill="none" opacity="0.8"/>

    <!-- Royal Crown -->
    <path d="M 90 42 L 102 24 L 120 36 L 138 24 L 150 42 L 138 48 L 120 44 L 102 48 Z" fill="url(#goldGrad)" stroke="#B87304" stroke-width="1.5"/>
    <circle cx="102" cy="22" r="3.5" fill="#FAB81E"/>
    <circle cx="120" cy="18" r="4.5" fill="#FAB81E"/>
    <circle cx="138" cy="22" r="3.5" fill="#FAB81E"/>

    <!-- Roaring Lion Head -->
    <g transform="translate(120, 96) scale(0.85)">
      <!-- Mane -->
      <path d="M 0 -45 C -35 -45 -55 -25 -55 10 C -55 35 -35 55 0 65 C 35 55 55 35 55 10 C 55 -25 35 -45 0 -45 Z" fill="#0A162B" stroke="#FAB81E" stroke-width="2.5"/>
      <!-- Face -->
      <path d="M 0 -30 L -25 -15 L -20 15 L 0 35 L 20 15 L 25 -15 Z" fill="url(#goldGrad)"/>
      <!-- Eyes & Features -->
      <polygon points="-16,-6 -6,-2 -12,4" fill="#080E18"/>
      <polygon points="16,-6 6,-2 12,4" fill="#080E18"/>
      <!-- Nose & Mouth -->
      <polygon points="0,8 -6,14 6,14" fill="#080E18"/>
      <path d="M -8 18 Q 0 24 8 18 L 0 28 Z" fill="#080E18"/>
      <!-- Cyan Accents on mane -->
      <path d="M -38 0 L -22 10 L -32 24" stroke="#38C6D9" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 38 0 L 22 10 L 32 24" stroke="#38C6D9" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Bottom Ribbon Banner -->
    <path d="M 45 170 L 60 158 L 180 158 L 195 170 L 180 184 L 60 184 Z" fill="url(#goldGrad)" stroke="#B87304" stroke-width="1.5"/>
    <text x="120" y="174" font-family="'Impact', 'Arial Black', -apple-system, sans-serif" font-weight="900" font-size="15" fill="#080E18" text-anchor="middle" letter-spacing="1.5px">CAYMAN SUPER KINGS</text>
  </g>
</svg>
