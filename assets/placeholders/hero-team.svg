<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101C3F"/>
      <stop offset="50%" stop-color="#172754"/>
      <stop offset="100%" stop-color="#0a1228"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(245, 158, 27, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#heroGrad)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  
  <g transform="translate(600, 260)" text-anchor="middle">
    <circle cx="0" cy="-20" r="70" fill="rgba(245, 158, 27, 0.15)" stroke="#F59E1B" stroke-width="2"/>
    <path d="M-30 20 L0 -40 L30 20 Z" fill="#F59E1B" opacity="0.9"/>
    <circle cx="0" cy="-45" r="10" fill="#38C6D9"/>
    
    <text y="90" font-family="'Archivo', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="2">
      [ DROP-IN TEAM PHOTO PLACEHOLDER ]
    </text>
    <text y="125" font-family="'IBM Plex Sans', sans-serif" font-size="16" fill="#38C6D9" letter-spacing="1">
      Recommended: 1920 × 1080px (Team Huddle / Match Action)
    </text>
    <text y="150" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="rgba(255,255,255,0.6)">
      Replace with real team photo in /assets/
    </text>
  </g>
</svg>
